<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#292c2f">
  <title>Veck.io</title>
  <link rel="preload" href="logo-v2.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="main.css">
  <style>
    html, body { background: #292c2f; overflow: hidden; }
    #unity-container { z-index: 1; }
    #unity-loading-container { z-index: 10; }
    #loading-error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      padding: 24px;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #fff;
      background: #1d2023;
      font: 16px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #loading-error.visible { display: flex; }
    #loading-error code {
      max-width: 800px;
      padding: 12px;
      overflow-wrap: anywhere;
      border-radius: 8px;
      color: #ffb4b4;
      background: #00000055;
      font-size: 13px;
    }
    #loading-error button {
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      color: #111;
      background: #ffd600;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #shift-lock-hint {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 15;
      padding: 10px 18px;
      border-radius: 999px;
      color: #111;
      background: #ffd600ee;
      font: 700 14px/1 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 24px #0008;
      transform: translateX(-50%);
    }
    #shift-lock-hint.visible { display: block; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading-container">
    <div id="loading-percentage">1%</div>
    <img src="logo-v2.webp" class="logo" alt="Veck.io" decoding="async" fetchpriority="high">
    <div id="unity-loading-bar"><div id="unity-loading-bar-inner"></div></div>
  </div>

  <div id="loading-error" role="alert">
    <strong>Veck.io could not start.</strong>
    <div>The game files did not finish loading. Check your connection and try again.</div>
    <code id="loading-error-detail"></code>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>

  <noscript>This game requires JavaScript and WebGL.</noscript>

  <script>
    // The official page uses its SDK for ads only. This mirror keeps the same
    // gameplay-facing API but resolves ad callbacks immediately, with no ad
    // network requests or overlays.
    window.ENABLE_ADS = false;
    window.SDK = {
      _isInitialized: true,
      _pendingBannerQueue: [],
      gameplayStart() {},
      gameplayEnd() {},
      loadingStart() {},
      loadingEnd() {},
      SetBanner() {},
      _adFinished(result) {
        if (window.unityInstance && window.unityInstance.SendMessage) {
          window.unityInstance.SendMessage("SDKManager", "OnVideoAdEnded", result ? "true" : "false");
        }
      },
      showMidroll() { this._adFinished(true); },
      showRewarded() { this._adFinished(true); }
    };

    (function () {
      var buildUrl = new URL("Build", document.baseURI).href.replace(/\/$/, "");
      var streamingAssetsUrl = new URL("StreamingAssets", document.baseURI).href.replace(/\/$/, "");
      var loaderUrl = buildUrl + "/__LOADER_FILE__";
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var loadingBar = document.querySelector("#unity-loading-bar-inner");
      var loadingPercentage = document.querySelector("#loading-percentage");
      var errorBox = document.querySelector("#loading-error");
      var errorDetail = document.querySelector("#loading-error-detail");

      // Shift lock: Unity hides the canvas cursor ("cursor: none") while a
      // match is running and restores it in menus, so that style is the
      // in-game signal. Browsers only grant pointer lock from a user gesture,
      // so capture the mouse as soon as gameplay asks for it and offer one
      // click whenever a request is refused.
      var shiftLock = (function () {
        if (!canvas || typeof canvas.requestPointerLock !== "function") return;
        if (typeof MutationObserver !== "function") return;
        if (window.matchMedia && !window.matchMedia("(pointer: fine)").matches) return;

        var wantsLock = false;
        var hint = document.createElement("div");
        hint.id = "shift-lock-hint";
        hint.textContent = "Click to lock the mouse";
        hint.addEventListener("pointerdown", function (event) {
          event.preventDefault();
          event.stopPropagation();
          lock();
        });
        document.body.appendChild(hint);

        function locked() {
          return document.pointerLockElement === canvas;
        }

        function showHint(show) {
          hint.classList.toggle("visible", Boolean(show) && wantsLock && !locked());
        }

        function lock() {
          if (!wantsLock || locked()) return;
          try {
            canvas.focus();
            var request = canvas.requestPointerLock();
            if (request && typeof request.then === "function") {
              request.then(function () { showHint(false); }, function () { showHint(true); });
            }
          } catch (error) {
            showHint(true);
          }
        }

        function sync() {
          var next = canvas.style.cursor === "none";
          if (next === wantsLock) return;
          wantsLock = next;
          if (!wantsLock) {
            showHint(false);
            if (locked() && typeof document.exitPointerLock === "function") document.exitPointerLock();
            return;
          }
          lock();
          showHint(!locked());
        }

        new MutationObserver(sync).observe(canvas, { attributes: true, attributeFilter: ["style"] });
        ["pointerdown", "mousedown", "touchstart", "keydown"].forEach(function (type) {
          window.addEventListener(type, function () {
            if (wantsLock && !locked()) lock();
          }, true);
        });
        document.addEventListener("pointerlockchange", function () { showHint(!locked()); });
        document.addEventListener("pointerlockerror", function () { showHint(true); });
        window.addEventListener("blur", function () { showHint(true); });
        return sync;
      })();

      function setProgress(progress) {
        var percent = Math.min(100, Math.max(1, Math.round(progress * 100)));
        loadingBar.style.width = percent + "%";
        loadingPercentage.textContent = percent + "%";
      }

      function fail(message, detail) {
        console.error(message, detail || "");
        loadingContainer.style.display = "none";
        errorBox.classList.add("visible");
        errorDetail.textContent = [message, detail].filter(Boolean).join("\n");
      }

      if (!window.WebGLRenderingContext) {
        fail("WebGL is not available in this browser.");
        return;
      }

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var resolutionScale = isMobile ? 1.3 : 1.0;
      var storedScale = parseFloat(localStorage.getItem("ResolutionScale"));
      if (!isNaN(storedScale)) resolutionScale = storedScale;

      var config = {
        dataUrl: buildUrl + "/__DATA_FILE__",
        frameworkUrl: buildUrl + "/__FRAMEWORK_FILE__",
        codeUrl: buildUrl + "/__CODE_FILE__",
        streamingAssetsUrl: streamingAssetsUrl,
        companyName: "LEGiON Platforms",
        productName: "Veck.io",
        productVersion: "__PRODUCT_VERSION__",
        autoSyncPersistentDataPath: true,
        devicePixelRatio: resolutionScale
      };

      // Audio watchdog: resume suspended Web Audio contexts after tab
      // switches or OS interruptions (Unity's built-in loop only runs once).
      var watchdog = document.createElement("script");
      watchdog.src = "nx-audio-watchdog.js";
      watchdog.onerror = function () {
        // The watchdog is optional; proceed without it so a missing watchdog
        // file never blocks game startup.
        console.warn("nx-audio-watchdog.js failed to load; continuing without it.");
        loadUnityLoader();
      };
      var loaderStarted = false;
      function loadUnityLoader() {
        if (loaderStarted) return;
        loaderStarted = true;
        var loader = document.createElement("script");
        loader.src = loaderUrl;
        loader.onload = function () {
          window.SDK.loadingStart();
          createUnityInstance(canvas, config, function (progress) {
            setProgress(progress);
          }).then(function (unityInstance) {
            window.unityInstance = unityInstance;
            window.SDK.loadingEnd();
            setProgress(1);
            setTimeout(function () {
              loadingContainer.remove();
              canvas.focus();
              if (typeof shiftLock === "function") shiftLock();
            }, 200);
          }).catch(function (error) {
            fail("Unity failed to start.", error && (error.stack || error.message || String(error)));
          });
        };
        loader.onerror = function () {
          fail("The Unity loader could not be downloaded.", loaderUrl);
        };
        document.body.appendChild(loader);
      }
      watchdog.onload = loadUnityLoader;
      document.body.appendChild(watchdog);
    })();
  </script>
</body>
</html>
